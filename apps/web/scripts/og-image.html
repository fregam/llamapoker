<!doctype html>
<!--
  Source for public/og.png, the 1200×630 link-preview image (og:image / twitter:image,
  added to every page by scripts/prerender.mjs). Edit this file, then re-render:
    node scripts/og-image.mjs
  which screenshots it with headless Chrome. Colours come from brand/tokens.css.
-->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Inter:wght@400;500;600&display=block" rel="stylesheet" />
<link href="../../../brand/tokens.css" rel="stylesheet" />
<style>
  :root { --rule:rgba(236,231,220,.14); }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; background:var(--ink); color:var(--paper); overflow:hidden; }
  body { font-family:"Inter",sans-serif; padding:64px 80px; display:grid; grid-template-columns:1fr 360px; grid-template-rows:auto 1fr auto; column-gap:72px; }
  .top { grid-column:1/-1; display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--rule); padding-bottom:22px; }
  .mark { font-family:"Bodoni Moda",serif; font-size:44px; font-weight:500; letter-spacing:-.01em; }
  .kicker { font-size:15px; letter-spacing:.22em; text-transform:uppercase; color:var(--text-3); }
  .copy { align-self:center; }
  h1 { font-family:"Bodoni Moda",serif; font-weight:400; font-size:92px; line-height:.98; letter-spacing:-.02em; }
  h1 em { font-style:italic; }
  .lead { margin-top:26px; font-size:25px; line-height:1.4; color:var(--text-2); max-width:600px; }
  .spec { align-self:center; border:1px solid var(--rule); padding:30px 30px 26px; }
  .cards { display:flex; gap:12px; margin-bottom:26px; }
  .card { width:74px; height:104px; background:var(--paper); color:#7a1f12; border-radius:6px; padding:8px 10px; font-family:"Bodoni Moda",serif; font-size:30px; line-height:1; display:flex; flex-direction:column; justify-content:space-between; }
  .card .pip { align-self:flex-end; font-size:34px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid var(--rule); padding:14px 0 10px; }
  .label { font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--text-3); }
  .num { font-family:"Bodoni Moda",serif; font-size:46px; line-height:1; }
  .num small { font-size:22px; color:var(--text-3); }
  .verdict { margin-top:12px; display:flex; align-items:center; gap:12px; font-size:22px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--sage); }
  .verdict i { width:10px; height:10px; border-radius:50%; background:var(--sage); }
  .foot { grid-column:1/-1; display:flex; justify-content:space-between; border-top:1px solid var(--rule); padding-top:20px; font-size:18px; color:var(--text-3); }
  .foot b { color:var(--paper); font-weight:500; letter-spacing:.02em; }
</style>
</head>
<body>
  <div class="top"><span class="mark">LlamaPoker</span><span class="kicker">No-Limit Hold'em</span></div>
  <div class="copy">
    <h1>Should you <em>call?</em></h1>
    <p class="lead">Free poker odds calculator &amp; trainer. Your equity, the pot odds, your outs and the right move, explained.</p>
  </div>
  <div class="spec">
    <div class="cards">
      <div class="card"><span>A</span><span class="pip">♥</span></div>
      <div class="card"><span>K</span><span class="pip">♥</span></div>
    </div>
    <div class="row"><span class="label">Equity</span><span class="num">38<small>%</small></span></div>
    <div class="row"><span class="label">Needed</span><span class="num">25<small>%</small></span></div>
    <div class="verdict"><i></i>Call</div>
  </div>
  <div class="foot"><b>llamapoker.com</b><span>Study · Review · Train</span></div>
</body>
</html>
