# Weekly dependency updates as pull requests, so CI checks them before anything reaches main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-tooling:
        dependency-type: development
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/reels
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
