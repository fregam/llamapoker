<!doctype html>
<!-- YouTube channel art, 2560×1440 → brand/social/youtube-banner.png. Phones show only the
     centre 1546×423 (x 507–2053, y 508–931), so the name and line stay inside it. -->
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="base.css" />
<style>
  html, body { width: 2560px; height: 1440px; }
  .art { left: 1440px; top: 560px; width: 880px; height: 880px; object-position: 50% 30%; }
  .copy { position: absolute; left: 560px; top: 540px; width: 900px; }
  .mark { font-size: 150px; }
  .display { font-size: 74px; margin-top: 34px; }
  .label { font-size: 24px; margin-top: 40px; }
</style></head>
<body>
  <img class="art" src="../.build/gentleman.png" alt="" />
  <div class="copy">
    <div class="mark">LlamaPoker</div>
    <div class="display">The llama is <em>reading you.</em></div>
    <div class="label">Free poker odds calculator &amp; trainer · llamapoker.com</div>
  </div>
</body></html>
