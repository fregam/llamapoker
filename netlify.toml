# Netlify deploy settings. `npm run build` type-checks, builds the client, builds the
# server entry and prerenders every page into dist/ (see scripts/prerender.mjs).
# SITE_URL is the live domain; the prerender uses it for canonical links, og:url and sitemap.xml.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SITE_URL = "https://llamapoker.com"

# Every real page has its own HTML file; anything else gets the app shell, which shows
# the 404 page, with a real 404 status.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
